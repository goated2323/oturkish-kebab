<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuisine — O'Turkish Kebab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--black:#111;--white:#fff;--grey:#555;--line:#e5e5e5;--bg:#f6f6f6;--green:#157f3d;--red:#c22e2e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font:16px/1.5 'Manrope',-apple-system,'Segoe UI',Arial,sans-serif;padding:20px;max-width:760px;margin:auto}
    h1{font-family:'Fraunces',Georgia,serif;margin:0;font-size:30px}
    .sub{color:var(--grey);font-size:14px;margin:4px 0 16px}
    .live{display:inline-block;padding:4px 14px;border-radius:999px;background:#e6f6ec;color:var(--green);font-weight:800;font-size:12px;letter-spacing:.08em}
    .kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;box-shadow:0 8px 26px rgba(0,0,0,.06)}
    .kcard h2{font-family:'Fraunces',Georgia,serif;margin:0;font-size:22px}
    .pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
    .pill.new{background:#fff4e0;color:#9a5b00;border:1px solid #f0d48a}
    .pill.accepted{background:#e6f6ec;color:var(--green);border:1px solid #9ed9b4}
    .pill.refused{background:#fdeaea;color:var(--red);border:1px solid #f3b0b0}
    .meta{color:var(--grey);font-size:13px;margin-top:4px}
    ul{margin:10px 0 0;padding-left:20px;color:#333;font-size:15px}
    .krow{display:flex;gap:10px;margin-top:14px}
    button{flex:1;min-height:56px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}
    .accept{background:var(--green);border:1px solid var(--green);color:#fff}
    .refuse{background:#fff;border:1px solid var(--red);color:var(--red)}
    button:disabled{opacity:.4}
    .empty{color:#999;text-align:center;padding:30px 0}
    .back{display:inline-block;margin-top:20px;color:#666;font-size:13px}
  </style>
</head>
<body>
  <h1>🔥 Cuisine <span class="live">● EN DIRECT</span></h1>
  <p class="sub">Laissez cette page ouverte. Chaque nouvelle commande déclenche un <strong>appel vocal</strong> sur le téléphone du restaurant + s'affiche ici. Validez avec Accepter / Refuser.</p>
  <div id="orders"></div>
  <a class="back" href="/">← Retour au site</a>
  <script>
    const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
    async function load(){
      const box=document.querySelector('#orders');
      try{
        const r=await fetch('/api/orders');const orders=await r.json();
        if(!orders.length){box.innerHTML='<p class="empty">Aucune commande pour le moment.</p>';return}
        box.innerHTML=orders.slice(0,20).map(o=>`<div class="kcard"><h2>${o.id} <span class="pill ${o.status}">${o.status==='new'?'Nouvelle':o.status==='accepted'?'Acceptée':'Refusée'}</span></h2><p class="meta">${o.customer_name} · <a href="tel:${o.customer_phone.replace(/\s/g,'')}">${o.customer_phone}</a> · ${new Date(o.created_at*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</p><ul>${o.items.map(it=>`<li>${it.quantity}x ${it.name}</li>`).join('')}</ul><p style="margin-top:8px"><strong>Total : ${eur(o.total_cents)}</strong></p>${o.status==='new'?`<div class="krow"><button class="accept" data-act="accept" data-id="${o.id}">✔ ACCEPTER</button><button class="refuse" data-act="refuse" data-id="${o.id}">✖ REFUSER</button></div>`:''}</div>`).join('');
      }catch(e){box.innerHTML='<p class="empty">Connexion perdue — vérifiez le serveur.</p>'}
    }
    document.querySelector('#orders').addEventListener('click',async e=>{
      const b=e.target.closest('button[data-act]');if(!b)return;
      b.disabled=true;
      try{await fetch(`/api/orders/${encodeURIComponent(b.dataset.id)}/${b.dataset.act}`,{method:'POST'})}catch(err){}
      load();
    });
    load();setInterval(load,5000);
  </script>
</body>
</html>
