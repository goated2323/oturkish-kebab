services:
  - type: web
    name: oturkish-kebab
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: RUST_LOG
        value: info
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://oturkish-kebab.onrender.com/?success=1
      - key: STRIPE_CANCEL_URL
        value: https://oturkish-kebab.onrender.com/?canceled=1
